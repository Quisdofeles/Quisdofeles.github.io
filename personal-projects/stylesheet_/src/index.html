<!doctype html>
<!-- index.html: the one and only page of Stylesheet_.
     It holds the static skeleton (top bar, three panels, status bar). JavaScript modules fill in
     the lists, canvases and controls. Load order: tokens first, then base, then one CSS file per panel. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stylesheet_</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Content Security Policy: only our own files and ssfile:// (imported fonts/vectors). No remote code. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' ssfile:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ssfile:; font-src 'self' data: blob: ssfile:; connect-src 'self' data: blob: ssfile:;">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/topbar.css">
  <link rel="stylesheet" href="styles/library.css">
  <link rel="stylesheet" href="styles/preview.css">
  <link rel="stylesheet" href="styles/editor.css">
  <link rel="stylesheet" href="styles/overlays.css">
</head>
<body>
  <div id="app">

    <!-- ===== Top bar (drag region) ===== -->
    <header id="topbar">
      <div class="brand">
        <span class="brand-word">Stylesheet</span><span class="brand-bar"></span>
      </div>
      <nav id="breadcrumb" aria-label="selection"></nav>
      <div class="grow"></div>
      <div class="top-actions">
        <button class="win-btn" id="btn-help" title="help (?)"></button>
        <button class="win-btn" id="btn-settings" title="settings"></button>
        <span class="top-divider"></span>
        <button class="win-btn" id="btn-min" title="minimize"></button>
        <button class="win-btn" id="btn-max" title="maximize"></button>
        <button class="win-btn win-close" id="btn-close" title="close"></button>
      </div>
    </header>

    <!-- ===== Three columns ===== -->
    <main id="columns">

      <!-- 01 — LIBRARY -->
      <aside id="library" class="panel">
        <div class="panel-head">
          <span class="section-label">01 — LIBRARY</span>
          <button class="btn btn-sm" id="btn-import">+ import</button>
        </div>
        <div class="library-body">
          <section class="lib-section" style="--w:1" id="sec-vectors">
            <header class="lib-head"><span>vectors</span><span class="lib-meta" id="meta-vectors"></span></header>
            <div class="lib-list scroll-area grid-vectors" id="list-vectors"></div>
          </section>
          <section class="lib-section" style="--w:1.4" id="sec-fonts">
            <header class="lib-head"><span>fonts</span><span class="lib-meta" id="meta-fonts"></span></header>
            <div class="lib-list scroll-area" id="list-fonts"></div>
          </section>
          <section class="lib-section" style="--w:1.4" id="sec-colors">
            <header class="lib-head"><span>colors<span class="dotcount" id="meta-colors"></span></span>
              <button class="plus-btn" id="btn-add-color" title="add color">+</button></header>
            <div class="lib-list scroll-area" id="list-colors"></div>
          </section>
          <section class="lib-section" style="--w:1.4" id="sec-palettes">
            <header class="lib-head"><span>palettes<span class="dotcount" id="meta-palettes"></span></span>
              <button class="plus-btn" id="btn-add-palette" title="add palette">+</button></header>
            <div class="lib-list scroll-area" id="list-palettes"></div>
          </section>
          <section class="lib-section" style="--w:1" id="sec-blocks">
            <header class="lib-head"><span>blocks</span><span class="lib-meta">drag in</span></header>
            <div class="lib-list scroll-area grid-blocks" id="list-blocks"></div>
          </section>
          <section class="lib-section" style="--w:1" id="sec-presets">
            <header class="lib-head"><span>presets</span><span class="lib-meta" id="meta-presets"></span></header>
            <div class="lib-list scroll-area" id="list-presets"></div>
          </section>
        </div>
      </aside>

      <!-- 02 — PREVIEW -->
      <section id="preview">
        <div id="stage">
          <div id="canvas-grid"></div>
          <div id="stage-empty">drag a preset or a block here to start</div>
        </div>

        <div class="float-bar" id="preview-bar">
          <span class="section-label">02 — PREVIEW</span>
          <span class="muted" id="grid-info">auto grid · 0 canvases</span>
          <span class="grow"></span>
          <span class="muted">zoom</span>
          <div class="seg">
            <button id="zoom-out" title="zoom out">−</button>
            <span class="seg-value" id="zoom-val">100%</span>
            <button id="zoom-in" title="zoom in">+</button>
          </div>
          <button class="btn" id="zoom-fit">fit</button>
        </div>

        <div class="float-bar" id="export-bar">
          <label class="check"><input type="checkbox" id="opt-labels"><span class="box"></span><span>include style labels</span></label>
          <span class="bar-label muted">format</span>
          <div class="seg" id="seg-format">
            <button data-format="png">PNG</button>
            <button data-format="jpeg">JPEG</button>
          </div>
          <button class="icon-toggle" id="opt-transparent" title="transparent background"></button>
          <span class="bar-label muted">scale</span>
          <div class="seg" id="seg-scale">
            <button data-scale="1">1×</button>
            <button data-scale="2">2×</button>
            <button data-scale="4">4×</button>
          </div>
          <span class="grow"></span>
          <button class="btn btn-primary" id="btn-export">export</button>
        </div>
      </section>

      <!-- 03 — EDITOR -->
      <aside id="editor" class="panel">
        <div class="panel-head"><span class="section-label">03 — EDITOR</span></div>
        <div class="layers-head">
          <span>layers</span>
          <button class="link-btn" id="btn-add-block">+ block</button>
        </div>
        <div id="layers" class="scroll-area"></div>
        <div class="props-divider"></div>
        <div id="props"></div>
        <div class="props-foot" id="preset-foot"></div>
      </aside>
    </main>

    <!-- ===== Status bar ===== -->
    <footer id="statusbar">
      <span id="status-counts">library: 0 fonts · 0 colors · 0 palettes · 0 vectors · 0 presets</span>
      <span id="status-brand">Stylesheet_ by HALFWIT Studios · v0.1</span>
    </footer>
  </div>

  <!-- Overlays, popovers, toasts and the offscreen export container live here -->
  <div id="overlay-root"></div>
  <div id="export-root" aria-hidden="true"></div>

  <!-- html-to-image is a classic script that defines window.htmlToImage; the app itself is ES modules -->
  <script src="vendor/html-to-image.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
