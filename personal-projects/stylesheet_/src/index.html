<!doctype html>
<!-- index.html: the one and only page of Stylesheet_.
     It holds the static skeleton (top bar, three panels, status bar). JavaScript modules fill in
     the lists, canvases and controls. Load order: tokens first, then base, then one CSS file per panel. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stylesheet_</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Content Security Policy: only our own files and ssfile:// (imported fonts/media). No remote code. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' ssfile:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ssfile:; font-src 'self' data: blob: ssfile:; connect-src 'self' data: blob: ssfile:;">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/topbar.css">
  <link rel="stylesheet" href="styles/library.css">
  <link rel="stylesheet" href="styles/preview.css">
  <link rel="stylesheet" href="styles/editor.css">
  <link rel="stylesheet" href="styles/overlays.css">
</head>
<!-- "glass-panels" = ON/OFF switch for the see-through library and editor panels (styles at the end of preview.css).
     Delete the class (leave <body>) to go back to the solid panels exactly as they were before. -->
<body class="glass-panels">
  <div id="app">

    <!-- ===== Top bar (drag region) ===== -->
    <header id="topbar">
      <div class="brand">
        <span class="brand-word">Stylesheet<span class="underscore">_</span></span><!-- old .brand-bar underscore removed: the "_" character above is the only underscore -->
      </div>
      <nav id="breadcrumb" aria-label="selection"></nav>
      <div class="grow"></div>
      <div class="top-actions">
        <button class="win-btn" id="btn-help" title="help (?)"></button>
        <button class="win-btn" id="btn-settings" title="settings"></button>
        <span class="top-divider"></span>
        <button class="win-btn" id="btn-min" title="minimize"></button>
        <button class="win-btn" id="btn-max" title="maximize"></button>
        <button class="win-btn win-close" id="btn-close" title="close"></button>
      </div>
    </header>

    <!-- ===== Three columns ===== -->
    <main id="columns">

      <!-- 01 — LIBRARY -->
      <aside id="library" class="panel">
        <div class="panel-head">
          <span class="section-label">01 — LIBRARY</span>
        </div>
        <div class="library-body">
          <!-- Section order: blocks, media, fonts, colors, palettes (the status bar uses the same order).
               Weights share the panel height: blocks (+ presets) 2, media 1, fonts 1.2, colors 1.5, palettes 1.5 -->
          <!-- Every <header class="lib-head"> is empty here: library.js (buildHeaders) fills them all with the ONE shared
               structure. data-label = the name; data-add = id of a "+ add" button; data-import = id of a "+ import" button
               (omit both to show the "drag in" hint); data-eyedropper = id of the eyedropper tool button (colors only). -->
          <section class="lib-section" style="--w:2" id="sec-blocks">
            <header class="lib-head" data-label="blocks"></header>
            <div class="lib-list scroll-area" id="list-blocks"></div>
          </section>
          <section class="lib-section" style="--w:1" id="sec-media">
            <header class="lib-head" data-label="media" data-import="btn-import-media"></header>
            <div class="lib-list scroll-area" id="list-media"></div>
          </section>
          <section class="lib-section" style="--w:1.2" id="sec-fonts">
            <header class="lib-head" data-label="fonts" data-import="btn-import-fonts"></header>
            <div class="lib-list scroll-area" id="list-fonts"></div>
          </section>
          <section class="lib-section" style="--w:1.5" id="sec-colors">
            <header class="lib-head" data-label="colors" data-add="btn-add-color" data-eyedropper="btn-eyedropper"></header>
            <div class="lib-list scroll-area" id="list-colors"></div>
          </section>
          <section class="lib-section" style="--w:1.5" id="sec-palettes">
            <header class="lib-head" data-label="palettes" data-add="btn-add-palette"></header>
            <div class="lib-list scroll-area" id="list-palettes"></div>
          </section>
        </div>
      </aside>

      <!-- 02 — PREVIEW -->
      <section id="preview">
        <div id="stage">
          <div id="canvas-grid"></div>
          <div id="stage-empty"><button class="dashed-btn" id="btn-add-canvas">drag in a canvas or preset</button></div>
        </div>

        <div class="float-bar" id="preview-bar">
          <span class="section-label">02 — PREVIEW</span>
          <span class="muted" id="grid-info">auto grid · 0 canvases</span>
          <span class="grow"></span>
          <span class="muted">zoom</span>
          <div class="seg">
            <button id="zoom-out" title="zoom out">−</button>
            <span class="seg-value" id="zoom-val">100%</span>
            <button id="zoom-in" title="zoom in">+</button>
          </div>
          <button class="btn" id="zoom-fit">fit</button>
        </div>

        <!-- Export bar: two columns of two stacked rows (labels | file settings), the export button top right -->
        <div class="float-bar" id="export-bar">
          <div class="export-col">
            <div class="export-row">
              <label class="check"><input type="checkbox" id="opt-labels"><span class="box"></span><span>style labels</span></label>
            </div>
            <div class="export-row">
              <label class="check"><input type="checkbox" id="opt-canvas-labels"><span class="box"></span><span>canvas labels</span></label>
            </div>
          </div>
          <div class="export-col">
            <div class="export-row">
              <span class="bar-label muted">format</span>
              <div class="seg" id="seg-format">
                <button data-format="png">PNG</button>
                <button data-format="jpeg">JPEG</button>
                <button data-format="webp">WEBP</button>
              </div>
              <button class="icon-toggle" id="opt-transparent" title="transparent background"></button>
            </div>
            <div class="export-row">
              <span class="bar-label muted">scale</span>
              <div class="seg" id="seg-scale">
                <button data-scale="1">1×</button>
                <button data-scale="2">2×</button>
                <button data-scale="4">4×</button>
              </div>
            </div>
          </div>
          <span class="grow"></span>
          <button class="btn" id="btn-export">export</button>
        </div>

        <!-- Notifications (overlays.js): above the export bar's right edge. The log button, with the toasts
             (collapsed) or the open log list (expanded) directly to its left, bottom-aligned with it.
             Empty space here never blocks the preview (pointer-events). -->
        <div id="notify">
          <div class="notify-row">
            <div id="notify-log" class="scroll-area"></div>
            <div id="toast-stack" class="toast-stack"></div>
            <button class="icon-toggle" id="btn-log" title="show notifications"></button>
          </div>
        </div>
      </section>

      <!-- 03 — EDITOR -->
      <aside id="editor" class="panel">
        <div class="panel-head"><span class="section-label">03 — EDITOR</span></div>
        <div class="layers-head">
          <span>layers</span>
          <button class="link-btn" id="btn-add-block">+ block</button>
        </div>
        <div id="layers" class="scroll-area"></div>
        <div class="props-divider"></div>
        <div id="props"></div>
        <div class="props-foot" id="preset-foot"></div>
      </aside>
    </main>

    <!-- ===== Status bar ===== -->
    <footer id="statusbar">
      <span id="status-counts">library: 0 blocks · 0 media · 0 fonts · 0 colors · 0 palettes</span>
      <span id="status-brand">Stylesheet_ by HALFWIT Studios · v0.1</span>
    </footer>
  </div>

  <!-- Overlays, popovers, toasts and the offscreen export container live here -->
  <div id="overlay-root"></div>
  <div id="export-root" aria-hidden="true"></div>

  <!-- html-to-image is a classic script that defines window.htmlToImage; the app itself is ES modules -->
  <script src="vendor/html-to-image.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
